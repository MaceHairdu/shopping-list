<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#193a30"><title>Shopping List</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f2;color:#193a30;font:16px system-ui,-apple-system,sans-serif}main{max-width:680px;margin:auto;padding:22px 16px 80px}h1{font-size:29px;margin:12px 0 24px}h2{font-size:20px}section{background:white;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 14px #122a1c10}input,select,button{font:inherit;border-radius:11px;padding:12px;border:1px solid #cad6ce;min-width:0}input{width:100%}button{background:#193a30;color:white;border:0;cursor:pointer}button.secondary{background:#e8efea;color:#193a30}button.danger{background:#fbe9e6;color:#8d3026}.line{display:flex;gap:8px;align-items:center;margin:10px 0}.line input{flex:1}.muted{color:#65786d;font-size:14px}.hidden{display:none}.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #edf0eb}.item span{flex:1;overflow-wrap:anywhere}.item.checked span{text-decoration:line-through;color:#87958c}.item input{width:22px;height:22px}.item button{padding:8px 11px}#message{color:#a32b20;min-height:20px}label{display:block;margin:8px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top button{white-space:nowrap}.pill{font-size:12px;padding:4px 8px;border-radius:12px;background:#e7eee9}
</style></head><body><main><div class="top"><h1>Shopping List</h1><button id="logout" class="secondary hidden">Sign out</button></div><p id="message" role="alert"></p>
<section id="auth"><h2>Sign in or create an account</h2><label>Email<input id="email" type="email" autocomplete="email" placeholder="you@example.com"></label><label>Password<input id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters"></label><div class="line"><button id="signin">Sign in</button><button id="signup" class="secondary">Create account</button></div><p class="muted">New accounts may need to confirm their email before signing in.</p></section>
<div id="app" class="hidden"><section><h2>Your lists</h2><div class="line"><input id="listName" placeholder="New list name"><button id="createList">Create</button></div><select id="lists" aria-label="Select shopping list"></select></section>
<section id="itemsPanel" class="hidden"><div class="top"><h2 id="currentName"></h2><span id="count" class="pill"></span></div><div class="line"><input id="itemName" placeholder="Add an item"><button id="addItem">Add</button></div><div class="line"><input id="quantity" placeholder="Quantity (optional)" aria-label="Quantity"><select id="category" aria-label="Category"><option>Other</option><option>Produce</option><option>Dairy</option><option>Meat</option><option>Frozen</option><option>Pantry</option><option>Household</option></select></div><div id="items"></div><button id="clearChecked" class="secondary">Remove checked items</button></section>
<section id="sharing" class="hidden"><h2>Share this list</h2><p class="muted">The other person must first create and verify their account.</p><div class="line"><input id="inviteEmail" type="email" placeholder="Their account email"><button id="invite">Share</button></div></section></div></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://jnvlytjnfamchnwukwtp.supabase.co','sb_publishable_kqochurVCSPP84zNpy5oQg_Eh1vn83m');
const $=id=>document.getElementById(id);let user=null,listId=null,channel=null,lists=[],items=[];
function message(e=''){$('message').textContent=e}
function error(e){message(e?.message||String(e))}
async function loadLists(){const {data,error:e}=await db.from('shopping_lists').select('id,name,created_by').order('created_at');if(e)return error(e);lists=data||[];$('lists').replaceChildren();for(const l of lists){const o=document.createElement('option');o.value=l.id;o.textContent=l.name;$('lists').append(o)}if(!lists.some(l=>l.id===listId))listId=lists[0]?.id||null;$('lists').value=listId||'';await selectList()}
async function selectList(){if(channel){await db.removeChannel(channel);channel=null}const l=lists.find(l=>l.id===listId);$('itemsPanel').classList.toggle('hidden',!l);$('sharing').classList.toggle('hidden',!l);if(!l)return;$('currentName').textContent=l.name;await loadItems();channel=db.channel('shopping-'+listId).on('postgres_changes',{event:'*',schema:'public',table:'shopping_items',filter:'list_id=eq.'+listId},()=>loadItems()).subscribe()}
async function loadItems(){if(!listId)return;const {data,error:e}=await db.from('shopping_items').select('*').eq('list_id',listId).order('created_at');if(e)return error(e);items=data||[];renderItems()}
function renderItems(){const root=$('items');root.replaceChildren();$('count').textContent=items.filter(x=>!x.is_checked).length+' remaining';for(const item of [...items].sort((a,b)=>Number(a.is_checked)-Number(b.is_checked))){const div=document.createElement('div');div.className='item'+(item.is_checked?' checked':'');const check=document.createElement('input');check.type='checkbox';check.checked=item.is_checked;check.setAttribute('aria-label','Check '+item.name);check.onchange=async()=>{const {error:e}=await db.from('shopping_items').update({is_checked:check.checked}).eq('id',item.id);if(e)error(e);await loadItems()};const span=document.createElement('span');span.textContent=item.name+(item.quantity&&item.quantity!=='1'?' · '+item.quantity:'')+' · '+item.category;const del=document.createElement('button');del.className='danger';del.textContent='×';del.setAttribute('aria-label','Delete '+item.name);del.onclick=async()=>{const {error:e}=await db.from('shopping_items').delete().eq('id',item.id);if(e)error(e);await loadItems()};div.append(check,span,del);root.append(div)}if(!items.length){const p=document.createElement('p');p.className='muted';p.textContent='No items yet.';root.append(p)}}
async function refresh(){const {data:{user:u}}=await db.auth.getUser();user=u;$('auth').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);$('logout').classList.toggle('hidden',!user);if(user)await loadLists();else if(channel){await db.removeChannel(channel);channel=null}}
$('signin').onclick=async()=>{message();const {error:e}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(e)error(e);else await refresh()};
$('signup').onclick=async()=>{message();const {error:e}=await db.auth.signUp({email:$('email').value.trim(),password:$('password').value});if(e)error(e);else message('Account created. Check your email for a confirmation link, then sign in.')};
$('logout').onclick=async()=>{await db.auth.signOut();listId=null;await refresh()};
$('createList').onclick=async()=>{message();const name=$('listName').value.trim();if(!name)return;const {data,error:e}=await db.from('shopping_lists').insert({name,created_by:user.id}).select('id').single();if(e)return error(e);$('listName').value='';listId=data.id;await loadLists()};
$('lists').onchange=async()=>{listId=$('lists').value;await selectList()};
$('addItem').onclick=async()=>{message();const name=$('itemName').value.trim();if(!name||!listId)return;const {error:e}=await db.from('shopping_items').insert({list_id:listId,name,quantity:$('quantity').value.trim()||'1',category:$('category').value,added_by:user.id});if(e)return error(e);$('itemName').value='';$('quantity').value='';await loadItems()};
$('itemName').onkeydown=e=>{if(e.key==='Enter')$('addItem').click()};
$('clearChecked').onclick=async()=>{message();const checked=items.filter(x=>x.is_checked).map(x=>x.id);if(!checked.length)return;const {error:e}=await db.from('shopping_items').delete().in('id',checked);if(e)error(e);await loadItems()};
$('invite').onclick=async()=>{message();const email=$('inviteEmail').value.trim();if(!email||!listId)return;const {error:e}=await db.rpc('invite_list_member',{p_list_id:listId,p_email:email});if(e)return error(e);$('inviteEmail').value='';message('');alert('List shared with '+email)};
db.auth.onAuthStateChange(()=>{setTimeout(refresh,0)});await refresh();
</script></body></html>
